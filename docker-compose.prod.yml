version: '3.8'

services:
  # MariaDB (Production)
  mariadb:
    image: mariadb:11
    container_name: projectroom-mariadb-prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME:-projectroom}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./docker/mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Redis (Production)
  redis:
    image: redis:7-alpine
    container_name: projectroom-redis-prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network

  # NestJS Backend (Production)
  nestjs:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: production
    container_name: projectroom-nestjs-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_HOST: mariadb
      DATABASE_PORT: 3306
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME:-projectroom}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_TTL: ${REDIS_TTL:-600}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET}
      # Matching Algorithm Weights
      WEIGHT_COMMON_TAGS: ${WEIGHT_COMMON_TAGS:-0.25}
      WEIGHT_VALUES_MATCH: ${WEIGHT_VALUES_MATCH:-0.20}
      WEIGHT_TIME_OVERLAP: ${WEIGHT_TIME_OVERLAP:-0.15}
      WEIGHT_DISTANCE: ${WEIGHT_DISTANCE:-0.15}
      WEIGHT_RESPONSIVENESS: ${WEIGHT_RESPONSIVENESS:-0.15}
      WEIGHT_QUALITY_SCORE: ${WEIGHT_QUALITY_SCORE:-0.10}
      # Feed Settings
      FEED_CANDIDATE_POOL_SIZE: ${FEED_CANDIDATE_POOL_SIZE:-200}
      FEED_RETURN_SIZE: ${FEED_RETURN_SIZE:-20}
      FEED_CACHE_TTL_SECONDS: ${FEED_CACHE_TTL_SECONDS:-600}
      # CORS (프로덕션 도메인으로 변경 필요)
      CORS_ORIGIN: ${CORS_ORIGIN}
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-3001}:3000"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    networks:
      - app-network
    # 프로덕션에서는 볼륨 마운트 제거 (이미지에 빌드됨)
    # logging 설정
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mariadb-data:
    driver: local
  redis-data:
    driver: local

networks:
  app-network:
    driver: bridge
